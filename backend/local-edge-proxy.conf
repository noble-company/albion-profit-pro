# Só existe pro ensaio local do docker-compose.production-local.yml — reproduz o roteamento
# "mesma origem" (stripprefix de /api) que o Traefik faz em produção, sem TLS/DNS real.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:8080/;
        proxy_set_header Host $host;
    }
}
