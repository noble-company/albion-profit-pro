version: "3.9"

x-image: &backend-image "${BACKEND_IMAGE:?defina BACKEND_IMAGE com imagem imutável}"
x-frontend-image: &frontend-image "${FRONTEND_IMAGE:?defina FRONTEND_IMAGE com imagem imutável}"
# Variáveis direto no ambiente do serviço (preenchidas pelas "Environment variables" da stack no
# Portainer, mesmo padrão usado nas outras stacks deste host) em vez de Docker secrets montados
# em arquivo — decisão de operação de VPS de operador único, não precisa do isolamento extra que
# `docker secret` dá pra times/multi-tenant. `src/config.py` já lê essas variáveis direto, sem
# nenhum código adicional: o mecanismo de secret em arquivo (`scripts/run_with_secrets.py`,
# `_FILE`) é opcional e só entra em uso se alguém setar essas variáveis com sufixo `_FILE`.
x-common-environment: &common-environment
  ENVIRONMENT: production
  DATABASE_URL: '${DATABASE_URL:?defina DATABASE_URL}'
  REDIS_URL: '${REDIS_URL:?defina REDIS_URL}'
  RABBITMQ_URL: '${RABBITMQ_URL:?defina RABBITMQ_URL}'
  JWT_SECRET: '${JWT_SECRET:?defina JWT_SECRET}'
  RESET_PASSWORD_TOKEN_SECRET: '${RESET_PASSWORD_TOKEN_SECRET:?defina RESET_PASSWORD_TOKEN_SECRET}'
  VERIFICATION_TOKEN_SECRET: '${VERIFICATION_TOKEN_SECRET:?defina VERIFICATION_TOKEN_SECRET}'
  CORS_ORIGINS: '${CORS_ORIGINS:?informe JSON com as origens permitidas}'
  TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:?informe JSON com os CIDRs do Traefik}'
services:
  migrate:
    image: *backend-image
    environment: *common-environment
    command: ["alembic", "upgrade", "head"]
    networks: [traefik-public]
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  seed:
    image: *backend-image
    environment: *common-environment
    command:
      - python
      - -m
      - scripts.run_after_bootstrap
      - --require
      - migrations
      - --
      - python
      - -m
      - scripts.seed_static_data
    networks: [traefik-public]
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  api:
    image: *backend-image
    environment: *common-environment
    command:
      - python
      - -m
      - scripts.run_after_bootstrap
      - --require
      - dataset
      - --
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
    networks: [traefik-public]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        # Router 1: host dedicado da API (ex: api.dominio.com). É o que o client Go
        # (ingest, `{base_url}/{topic}`) usa desde a Fase 2 — mantido como está, intocado.
        - traefik.http.routers.profitpro-api.rule=Host(`${API_HOST:?defina API_HOST}`)
        - traefik.http.routers.profitpro-api.entrypoints=websecure
        - traefik.http.routers.profitpro-api.tls=true
        - traefik.http.routers.profitpro-api.middlewares=profitpro-body-limit@swarm
        - traefik.http.middlewares.profitpro-body-limit.buffering.maxRequestBodyBytes=10485760
        - traefik.http.services.profitpro-api.loadbalancer.server.port=8000
        # Router 2: mesma origem do frontend (task 3.6/13, P01) — a SPA chama `/api/...` no
        # próprio host dela; o Traefik tira o prefixo antes de encaminhar pro backend, que
        # continua recebendo `/items/...`, `/craft/...` etc. sem mudança nenhuma de rota.
        # Fecha CORS em produção (`S04`): front e API na mesma origem, sem preflight.
        - traefik.http.routers.profitpro-api-mesma-origem.rule=Host(`${APP_HOST:?defina APP_HOST}`) && PathPrefix(`/api`)
        - traefik.http.routers.profitpro-api-mesma-origem.entrypoints=websecure
        - traefik.http.routers.profitpro-api-mesma-origem.tls=true
        - traefik.http.routers.profitpro-api-mesma-origem.priority=10
        - traefik.http.routers.profitpro-api-mesma-origem.service=profitpro-api
        # `@swarm`, não `@docker` -- o provider do Traefik pra serviços Swarm se chama "swarm"
        # (confirmado no dashboard: os próprios roteadores aparecem como "nome@swarm"). Com
        # `@docker`, o Traefik não acha o middleware, marca a rota inteira como erro e cai pro
        # próximo roteador que bate (o do frontend) -- foi o que causou um 405 do nginx do
        # frontend em vez de chegar na API no primeiro deploy real (task 19).
        - traefik.http.routers.profitpro-api-mesma-origem.middlewares=profitpro-body-limit@swarm,profitpro-strip-api@swarm
        - traefik.http.middlewares.profitpro-strip-api.stripprefix.prefixes=/api

  worker-ingest:
    image: *backend-image
    environment: *common-environment
    command: ["python", "-m", "scripts.run_after_bootstrap", "--require", "dataset", "--", "celery", "-A", "src.celery_app.celery_app", "worker", "--queues", "ingest", "--concurrency", "4", "--prefetch-multiplier", "1", "--hostname", "ingest@%h", "--loglevel", "INFO"]
    networks: [traefik-public]
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping --destination ingest@$$(hostname) --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker-maintenance:
    image: *backend-image
    environment: *common-environment
    command: ["python", "-m", "scripts.run_after_bootstrap", "--require", "dataset", "--", "celery", "-A", "src.celery_app.celery_app", "worker", "--queues", "maintenance", "--concurrency", "1", "--prefetch-multiplier", "1", "--hostname", "maintenance@%h", "--loglevel", "INFO"]
    networks: [traefik-public]
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping --destination maintenance@$$(hostname) --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker-quarantine:
    image: *backend-image
    environment: *common-environment
    command: ["python", "-m", "scripts.run_after_bootstrap", "--require", "dataset", "--", "celery", "-A", "src.celery_app.celery_app", "worker", "--queues", "quarantine", "--concurrency", "1", "--prefetch-multiplier", "1", "--hostname", "quarantine@%h", "--loglevel", "INFO"]
    networks: [traefik-public]
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping --destination quarantine@$$(hostname) --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  beat:
    image: *backend-image
    environment: *common-environment
    command: ["python", "-m", "scripts.run_after_bootstrap", "--require", "dataset", "--", "celery", "-A", "src.celery_app.celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule", "--pidfile", "/tmp/celerybeat.pid", "--loglevel", "INFO"]
    networks: [traefik-public]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure

  frontend:
    image: *frontend-image
    networks: [traefik-public]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.profitpro-frontend.rule=Host(`${APP_HOST:?defina APP_HOST}`)
        - traefik.http.routers.profitpro-frontend.entrypoints=websecure
        - traefik.http.routers.profitpro-frontend.tls=true
        - traefik.http.routers.profitpro-frontend.priority=1
        - traefik.http.services.profitpro-frontend.loadbalancer.server.port=8080

networks:
  traefik-public:
    external: true
