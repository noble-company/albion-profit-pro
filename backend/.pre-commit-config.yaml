repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv --directory backend run ruff check --fix .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format
        entry: uv --directory backend run ruff format .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
