services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: profitpro
      POSTGRES_PASSWORD: profitpro
      POSTGRES_DB: profitpro
    ports:
      - "5433:5432"  # 5432 já está em uso no host por outro projeto local (chatwoot-noble-postgres-1)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379"  # 6379 já está em uso no host por outro projeto local (chatwoot-noble-redis-1)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # painel de management (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
