<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculadora de crafting e refino para Albion Online"
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Albion Profit Pro</title>
    <script>
      // Aplica o tema antes da 1ª pintura (evita flash escuro→claro ou vice-versa).
      // Mantido em sincronia com a lógica de src/app/ThemeContext.tsx.
      ;(function () {
        try {
          var KEY = 'albion-profit-pro:theme'
          var saved = localStorage.getItem(KEY)
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
