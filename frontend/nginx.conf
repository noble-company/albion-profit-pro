server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hash no nome do arquivo (Vite) — o conteúdo nunca muda sob a mesma URL.
    # `=404` em vez de cair no fallback de baixo: um asset inexistente não pode virar HTML,
    # senão o navegador tenta interpretar a página de erro como JS/CSS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: rota desconhecida (roteamento do React Router) devolve o documento base;
    # arquivo estático existente é servido como está.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
